
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Contenedor general que ocupa alto de la pantalla (min-vh-100) -->
    <div class="d-flex min-vh-100">
        <aside class="d-flex flex-column bg-white border-end p-3" style="width: 250px;">

            <!-- Cabecera -->
            <div class="d-flex align-items-center gap-2 pb-3 mb-3 border-bottom">
                <h5>Company</h5>
            </div>

            <ul class="nav nav-pills flex-column gap-3">
                <li class="nav-item">
                    <a href="../../admin.html" class="nav-link active p-0 text-center align-items-center gap-2">
                        Inicio
                    </a>
                </li>
            </ul>
            <hr>
            <!-- Menú superior -->
            <ul class="nav flex-column gap-3">
                <strong>Gestion de Usuarios</strong>
                <li class="nav-item">
                    <a href="../../usuarios/ver-usuarios/ver-usuarios.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Ver Usuarios
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../../usuarios/editar-usuario/editar-usuario.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Editar Usuario
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../../usuarios/nuevo-usuario/nuevo-usuario.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Nuevo Usuario
                    </a>
                </li>
            </ul>
            <hr>
            <ul class="nav flex-column gap-3">
                <strong>Gestion de Productos</strong>
                <li class="nav-item">
                    <a href="../ver-productos/ver-productos.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Ver Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../editar-producto/editar-producto.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Editar Producto
                    </a>
                </li>
                <li class="nav-item">
                    <a href="nuevo-producto.html" class="nav-link p-0 text-dark d-flex align-items-center gap-2">
                        Nuevo Producto
                    </a>
                </li>
            </ul>


            <!-- Menú inferior (empujado hacia abajo con mt-auto) -->
            <div class="mt-auto">
                <!-- Perfil abajo -->
                <div class="pt-3 border-top">
                    <a href="#Profile" class="nav-link p-0 text-dark d-flex align-items-center gap-2 fw-bold">
                        Profile
                    </a>
                </div>
            </div>

        </aside>

         <main class="flex-grow-1 d-flex flex-column">

            <div class="p-4 border-bottom flex-grow-1">
                <h1>Nuevo Producto</h1>

                <form id="formProducto" class="mt-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" placeholder="Ej: GA006">
                        </div>
                        <div class="col-md-4">
                            <label for="categoria" class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="categoria" placeholder="Ej: Guitarras Acústicas">
                        </div>
                        <div class="col-md-4">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej: Guitarra Acústica Folk">
                        </div>
                        <div class="col-md-4">
                            <label for="marca" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marca" placeholder="Ej: Yamaha">
                        </div>
                        <div class="col-md-4">
                            <label for="modelo" class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modelo" placeholder="Ej: F310">
                        </div>
                        <div class="col-md-4">
                            <label for="stock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="stock" placeholder="0" min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio" placeholder="0" min="0">
                        </div>
                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="3"
                                placeholder="Descripción del producto"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Guardar Producto</button>
                    <button type="reset" class="btn btn-secondary mt-3 ms-2">Limpiar</button>
                </form>

                <div id="mensaje" class="mt-3"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="../js/bd.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
