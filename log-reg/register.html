<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <div class="container-fluid py-3 shadow" style="background-color: #1E5A9C;">
        <div class="container">
            <div class="row align-items-center text-center">
                <div class="col-12 col-lg-3 text-lg-start mb-2 mb-lg-0">
                    <p class="fs-2 fs-md-1 mb-0 fw-bold" style="color: #BFE3FA;">Sonido Vivo</p>
                </div>
                <div class="col-12 col-lg-6 mb-2 mb-lg-0">
                    <nav class="fs-6 fs-md-5 d-flex flex-wrap justify-content-center gap-2">
                        <a href="../Inicio/Menu.html" class="text-decoration-none" style="color: #BFE3FA;">Home</a>
                        <span style="color: #BFE3FA;">|</span>
                        <a href="#productos" class="text-decoration-none" style="color: #BFE3FA;">Productos</a>
                        <span style="color: #BFE3FA;">|</span>
                        <a href="#nosotros" class="text-decoration-none" style="color: #BFE3FA;">Nosotros</a>
                        <span style="color: #BFE3FA;">|</span>
                        <a href="#blogs" class="text-decoration-none" style="color: #BFE3FA;">Blogs</a>
                        <span style="color: #BFE3FA;">|</span>
                        <a href="#contacto" class="text-decoration-none" style="color: #BFE3FA;">Contacto</a>
                    </nav>
                </div>
                <div class="col-12 col-lg-3 text-lg-end">
                    <button type="button" class="btn btn-outline-light position-relative" onclick="window.location.href='carrito.html'">
                        🛒 Carrito 
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                            <span class="visually-hidden">elementos en el carrito</span>
                        </span>
                    </button>
                </div>
                </div>
            </div>
        </div>
    </div>

    <section id="registro" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow border-0 rounded-3" style="background-color: #BFE3FA;">
                        <div class="card-header bg-primary text-white text-center py-3 rounded-top-3">
                            <h4 class="mb-0">Registro de usuario</h4>
                        </div>
                        <div class="card-body p-4 text-start shadow-lg rounded-bottom-3" style="background-color: #BFE3FA;">
                            <form action="" method="" id="formulario" novalidate>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                                    <input type="text" class="form-control shadow" id="nombre" placeholder="Escriba su nombre completo" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control shadow" id="email" placeholder="name@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control shadow" id="password" placeholder="Escriba su contraseña" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label fw-semibold">Confirmar contraseña</label>
                                    <input type="password" class="form-control shadow" id="confirmPassword" placeholder="Confirme su contraseña" required>
                                </div>
                                <div class="mb-3">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono (Opcional)</label>
                                    <input type="tel" class="form-control shadow" id="telefono" placeholder="Ej: 987654321">
                                    <div class="invalid-feedback">Ingrese un número válido.</div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 mt-3 shadow-sm">Registrarse</button>
                                <div id="resultado-boton" class="mt-4" role="alert"></div>
                                <div class="text-center mt-3">
                                    <p>¿Ya tienes una cuenta? <a href="login.html" class="text-decoration-none">Inicia sesión aquí</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
